
name: Sincronizzazione annunci Idealista

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sincronizzazione-idealista
  cancel-in-progress: false

jobs:
  sincronizza:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Genera JSON immobili
        env:
          FTP_HOST: ${{ secrets.IDEALISTA_FTP_HOST }}
          FTP_USER: ${{ secrets.IDEALISTA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IDEALISTA_FTP_PASSWORD }}
        run: python3 genera_annunci.py

      - name: Verifica JSON
        run: |
          python3 - <<'PY'
          import json

          with open("data/annunci.json", encoding="utf-8") as f:
              annunci = json.load(f)

          if not isinstance(annunci, list) or not annunci:
              raise SystemExit("ERRORE: JSON vuoto o non valido")

          print("JSON valido")
          print("Immobili trovati:", len(annunci))
          for immobile in annunci:
              print(
                  "ID:", immobile["id"],
                  "| Località:", immobile["localita"],
                  "| Prezzo:", immobile["prezzo"],
                  "| Foto:", len(immobile["immagini"])
              )
          PY

      - name: Salva annunci aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/annunci.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica agli annunci"
          else
            git commit -m "Aggiornamento automatico annunci Idealista"
            git push
          fi
