
name: Verifica FTP Idealista

on:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Analizza campi immobili XML
        env:
          FTP_HOST: ${{ secrets.IDEALISTA_FTP_HOST }}
          FTP_USER: ${{ secrets.IDEALISTA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IDEALISTA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import io
          from ftplib import FTP
          import xml.etree.ElementTree as ET

          def tag(e):
              return e.tag.split("}")[-1]

          def struttura(elemento, livello=0, massimo=3):
              if livello > massimo:
                  return
              figli = list(elemento)
              gruppi = {}
              for figlio in figli:
                  nome = tag(figlio)
                  gruppi.setdefault(nome, []).append(figlio)
              for nome, elementi in gruppi.items():
                  print(
                      "  " * livello + "- " + nome +
                      " (" + str(len(elementi)) + ")"
                  )
                  if livello < massimo:
                      struttura(
                          elementi[0], livello + 1, massimo
                      )

          with FTP(timeout=30) as ftp:
              ftp.connect(os.environ["FTP_HOST"], 21)
              ftp.login(
                  os.environ["FTP_USER"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.set_pasv(True)

              nomi = ftp.nlst()
              principali = [
                  n for n in nomi
                  if n.lower().endswith(".xml")
                  and not any(
                      n.lower().endswith("_" + s + ".xml")
                      for s in (
                          "activities", "agents", "clients",
                          "enquiries", "groups", "operations"
                      )
                  )
              ]
              if len(principali) != 1:
                  raise SystemExit(
                      "Atteso un solo XML principale"
                  )

              dati = io.BytesIO()
              ftp.retrbinary(
                  "RETR " + principali[0],
                  dati.write
              )

          radice = ET.fromstring(dati.getvalue())
          annunci = [
              e for e in radice if tag(e) == "ad"
          ]

          print("NUMERO ANNUNCI:", len(annunci))

          if not annunci:
              raise SystemExit("Nessun annuncio trovato")

          primo = annunci[0]

          for sezione in (
              "property", "prices", "comments",
              "multimedias", "scope", "services"
          ):
              elemento = next(
                  (
                      e for e in primo
                      if tag(e) == sezione
                  ),
                  None
              )
              print("\nSEZIONE:", sezione)
              if elemento is None:
                  print("Non presente")
              else:
                  struttura(elemento, massimo=4)

          print("\nANALISI COMPLETATA")
          PY
