

name: Verifica FTP Idealista

on:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Analizza campi immobili XML
        env:
          FTP_HOST: ${{ secrets.IDEALISTA_FTP_HOST }}
          FTP_USER: ${{ secrets.IDEALISTA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IDEALISTA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import io
          from ftplib import FTP
          import xml.etree.ElementTree as ET

          def tag(elemento):
              return elemento.tag.split("}")[-1].lower()

          def struttura(elemento, livello=0, massimo=4):
              if livello > massimo:
                  return

              gruppi = {}
              for figlio in elemento:
                  nome = tag(figlio)
                  gruppi.setdefault(nome, []).append(figlio)

              for nome, elementi in gruppi.items():
                  print(
                      "  " * livello
                      + "- " + nome
                      + " (" + str(len(elementi)) + ")"
                  )
                  if livello < massimo:
                      struttura(
                          elementi[0],
                          livello + 1,
                          massimo
                      )

          host = os.environ["FTP_HOST"]
          host = host.replace("ftp://", "").replace("/", "")

          with FTP(timeout=30) as ftp:
              ftp.connect(host, 21)
              ftp.login(
                  os.environ["FTP_USER"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.set_pasv(True)

              nomi = ftp.nlst()

              print("CONNESSIONE FTP RIUSCITA")
              print("File trovati:", len(nomi))

              candidati = [
                  nome for nome in nomi
                  if nome.lower().endswith(".xml")
                  and not any(
                      nome.lower().endswith("_" + s + ".xml")
                      for s in (
                          "activities",
                          "agents",
                          "clients",
                          "enquiries",
                          "groups",
                          "operations"
                      )
                  )
              ]

              print("XML candidati:", len(candidati))

              if not candidati:
                  raise SystemExit(
                      "Nessun XML candidato trovato"
                  )

              radice = None
              annunci = []
              selezionato = None

              for nome in candidati:
                  print("Analizzo:", nome)

                  dati = io.BytesIO()

                  try:
                      ftp.retrbinary(
                          "RETR " + nome,
                          dati.write
                      )
                      xml = ET.fromstring(dati.getvalue())

                      trovati = [
                          e for e in xml.iter()
                          if tag(e) == "ad"
                      ]

                      print(
                          "Annunci trovati:",
                          len(trovati)
                      )

                      if trovati:
                          radice = xml
                          annunci = trovati
                          selezionato = nome
                          break

                  except ET.ParseError as errore:
                      print("XML non valido:", errore)
                  except Exception as errore:
                      print(
                          "Impossibile leggere il file:",
                          type(errore).__name__
                      )

          if not annunci:
              raise SystemExit(
                  "Nessun annuncio trovato negli XML"
              )

          print("\nXML SELEZIONATO:", selezionato)
          print("NUMERO ANNUNCI:", len(annunci))

          primo = annunci[0]

          print("\nCAMPI PRINCIPALI:")
          struttura(primo, massimo=1)

          for sezione in (
              "property",
              "prices",
              "comments",
              "multimedias",
              "scope",
              "services"
          ):
              elemento = next(
                  (
                      e for e in primo
                      if tag(e) == sezione
                  ),
                  None
              )

              print("\nSEZIONE:", sezione)

              if elemento is None:
                  print("Non presente")
              else:
                  struttura(elemento, massimo=4)

          print("\nANALISI COMPLETATA")
          PY
