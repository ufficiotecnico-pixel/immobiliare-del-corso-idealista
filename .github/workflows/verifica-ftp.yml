
name: Verifica FTP Idealista

on:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Controlla struttura XML
        env:
          FTP_HOST: ${{ secrets.IDEALISTA_FTP_HOST }}
          FTP_USER: ${{ secrets.IDEALISTA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IDEALISTA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import io
          from ftplib import FTP
          import xml.etree.ElementTree as ET

          with FTP(timeout=30) as ftp:
              ftp.connect(os.environ["FTP_HOST"], 21)
              ftp.login(
                  os.environ["FTP_USER"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.set_pasv(True)

              files = ftp.nlst()
              main_files = [
                  f for f in files
                  if f.lower().endswith(".xml")
                  and not any(
                      f.lower().endswith("_" + s + ".xml")
                      for s in [
                          "activities", "agents", "clients",
                          "enquiries", "groups", "operations"
                      ]
                  )
              ]

              if not main_files:
                  raise SystemExit("File XML principale non trovato")

              name = main_files[0]
              data = io.BytesIO()
              ftp.retrbinary("RETR " + name, data.write)

          root = ET.fromstring(data.getvalue())

          def tag_name(tag):
              return tag.split("}")[-1]

          print("XML PRINCIPALE TROVATO")
          print("Dimensione in byte:", len(data.getvalue()))
          print("Elemento principale:", tag_name(root.tag))
          print("Numero elementi diretti:", len(root))
          print("Tipi di elementi diretti:")
          print(sorted(set(tag_name(e.tag) for e in root)))

          print("STRUTTURA PRIMI ELEMENTI:")
          for child in list(root)[:3]:
              print("Elemento:", tag_name(child.tag))
              print("Campi:", [
                  tag_name(e.tag) for e in list(child)[:25]
              ])

          print("VERIFICA COMPLETATA")
          PY
